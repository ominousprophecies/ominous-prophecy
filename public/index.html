<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ominous Prophecy — The AI Oracle</title>
  <link rel="icon" type="image/svg+xml" id="animated-favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080608;
      --deep: #0d0a10;
      --void: #120e16;
      --crimson: #8b1a1a;
      --blood: #c0392b;
      --ember: #e85d04;
      --gold: #c9a84c;
      --pale-gold: #e8d5a3;
      --silver: #e2deee;
      --mist: #eae6f4;
      --white: #f0edf5;
      --glow: rgba(201,168,76,0.15);
      --glow-red: rgba(139,26,26,0.3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'IM Fell English', Georgia, serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: .6;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.5); }
      50% { opacity: var(--max-op, .6); transform: scale(1); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 6, 8, .85) 100%);
      pointer-events: none;
      z-index: 2;
    }

    nav {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid rgba(201,168,76, .15);
    }

    .nav-sigil {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px;
      letter-spacing: .3em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: .8;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--silver);
      text-decoration: none;
      text-transform: uppercase;
      transition: color .3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-submit {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--gold);
      border: none;
      padding: 9px 20px;
      cursor: pointer;
      transition: opacity .2s;
    }

    .nav-submit:hover {
      opacity: .85;
    }

    .hero {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 80px 48px 60px;
      overflow: hidden;
      max-width: 1296px;
      margin: 0 auto;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 26, 26, .12) 0%, transparent 70%);
      pointer-events: none;
    }

    .oracle-eye {
      width: 480px;
      height: 300px;
      margin: 0 auto 32px;
    }

    .hero-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .4em;
      color: var(--crimson);
      text-transform: uppercase;
      margin-bottom: 20px;
      animation: fade-in 1s ease .3s both;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(32px, 6vw, 68px);
      font-weight: 900;
      line-height: 1.05;
      color: var(--pale-gold);
      letter-spacing: .05em;
      margin-bottom: 8px;
      animation: fade-up 1s ease .5s both;
      text-shadow: 0 0 60px rgba(201,168,76, .2);
      text-align: center;
      word-wrap: break-word;
    }

    .hero-sub {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(14px, 2.5vw, 22px);
      color: var(--crimson);
      letter-spacing: .1em;
      margin-bottom: 28px;
      animation: fade-up 1s ease .7s both;
      text-align: center;
    }

    .hero-desc {
      font-family: 'IM Fell English', serif;
      font-size: 18px;
      color: #eae6e0;
      max-width: 560px;
      margin: 0 auto 48px;
      line-height: 1.8;
      animation: fade-up 1s ease .9s both;
      text-align: center;
      word-wrap: break-word;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .oracle-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 60px;
      animation: fade-in 1s ease 1.2s both;
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-family: 'Cinzel Decorative', serif;
      font-size: 28px;
      color: var(--gold);
      display: block;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: .3em;
      color: #e0dcea;
      text-transform: uppercase;
    }

    .stat-divider {
      width: 1px;
      background: rgba(201,168,76, .2);
      align-self: stretch;
    }

    .ticker-wrap {
      position: relative;
      z-index: 10;
      background: rgba(139, 26, 26, .08);
      border-top: 1px solid rgba(139, 26, 26, .3);
      border-bottom: 1px solid rgba(139, 26, 26, .3);
      padding: 12px 0;
      overflow: hidden;
      margin-bottom: 48px;
    }

    .ticker-label {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--crimson);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: .2em;
      color: var(--white);
      text-transform: uppercase;
      z-index: 2;
      white-space: nowrap;
    }

    .ticker-track {
      display: flex;
      gap: 80px;
      animation: ticker 40s linear infinite;
      padding-left: 140px;
      white-space:nowrap;
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'IM Fell English', serif;
      font-size: 14px;
      color: var(--mist);
    }

    .ticker-prob {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-style: normal;
      padding: 2px 8px;
      border-radius: 2px;
      font-weight: 700;
    }

    .prob-high { background: rgba(139, 26, 26, .4); color: #ff6b6b; }
    .prob-med { background: rgba(201,168,76, .2); color: var(--gold); }
    .prob-low { background: rgba(100, 100, 120, .3); color: var(--silver); }
    .ticker-sep { color: var(--crimson); opacity: .5; }

    .main-grid {
      position: relative;
      z-index: 10;
      max-width: 1296px;
      margin: 0 auto;
      padding: 0 48px 80px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 48px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .section-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(201,168,76, .3), transparent);
    }

    .prophecy-card {
      background: rgba(13, 10, 16, .8);
      border: 1px solid rgba(201,168,76, .1);
      margin-bottom: 20px;
      padding: 24px 28px;
      position: relative;
      transition: border-color .3s, transform .2s;
      cursor: pointer;
      overflow: hidden;
      animation: card-appear .6s ease both;
    }

    .prophecy-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--border-color, var(--gold));
      opacity: .6;
    }

    .prophecy-card:hover {
      border-color: rgba(201,168,76, .3);
      transform: translateX(4px);
    }

    .prophecy-card.danger { --border-color: var(--blood); }
    .prophecy-card.warning { --border-color: var(--ember); }
    .prophecy-card.neutral { --border-color: var(--silver); }

    .prophecy-card:nth-child(1) { animation-delay: .1s; }
    .prophecy-card:nth-child(2) { animation-delay: .2s; }
    .prophecy-card:nth-child(3) { animation-delay: .3s; }
    .prophecy-card:nth-child(4) { animation-delay: .4s; }

    @keyframes card-appear {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-category {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 2px;
    }

    .cat-geopolitics { background: rgba(139, 26, 26, .3); color: #ff8080; }
    .cat-climate { background: rgba(0, 100, 60, .3); color: #80ffb0; }
    .cat-tech { background: rgba(40, 60, 139, .3); color: #80a0ff; }
    .cat-economy { background: rgba(139, 100, 0, .3); color: var(--gold); }
    .cat-society { background: rgba(100, 0, 139, .3); color: #d080ff; }
    .cat-governance { background: rgba(40, 80, 139, .3); color: #87ceeb; }
    .cat-conflict { background: rgba(139, 26, 26, .4); color: #ff6b6b; }
    .cat-health { background: rgba(0, 139, 100, .3); color: #80ffe0; }
    .cat-energy { background: rgba(139, 100, 0, .4); color: #ffb347; }
    .cat-sport, .cat-sports { background: rgba(100, 0, 139, .3); color: #d080ff; }

    .card-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #e0dcee;
      margin-left: auto;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 19px;
      color: var(--pale-gold);
      line-height: 1.45;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .card-excerpt {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 19px;
      color: var(--silver);
      line-height: 1.85;
      margin-bottom: 18px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .probability-bar-wrap {
      flex: 1;
      margin-right: 20px;
    }

    .prob-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #e0dcea;
      margin-bottom: 5px;
    }

    .probability-bar {
      height: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 2px;
      overflow: hidden;
    }

    .probability-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s ease;
      background: var(--fill-color, var(--gold));
    }

    .fill-high { --fill-color: #ff6b6b; }
    .fill-med { --fill-color: var(--gold); }
    .fill-low { --fill-color: var(--silver); }

    .card-votes {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #e0dcee;
      white-space: normal;
      line-height: 1.5;
    }

    .oracle-input-section {
      background: rgba(13, 10, 16, .9);
      border: 1px solid rgba(201,168,76, .15);
      padding: 32px;
      margin-bottom: 48px;
    }

    .oracle-input-section h3 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 6px;
      letter-spacing: .05em;
    }

    .oracle-input-section p {
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      color: #e2deee;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .oracle-textarea {
      width: 100%;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(201,168,76, .2);
      color: var(--mist);
      font-family: 'IM Fell English', serif;
      font-size: 15px;
      padding: 16px;
      resize: none;
      height: 100px;
      outline: none;
      transition: border-color .3s;
      margin-bottom: 12px;
    }

    .oracle-textarea::placeholder {
      color: rgba(168, 164, 184, .3);
      font-style: italic;
    }

    .oracle-textarea:focus {
      border-color: rgba(201,168,76, .5);
    }

    .oracle-submit {
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .3em;
      text-transform: uppercase;
      padding: 14px;
      cursor: pointer;
      transition: all .3s;
    }

    .oracle-submit:hover {
      background: var(--gold);
      color: var(--black);
    }

    .oracle-verdict {
      background: linear-gradient(135deg, rgba(139, 26, 26, .15), rgba(13, 10, 16, .9));
      border: 1px solid rgba(139, 26, 26, .3);
      padding: 28px;
      margin-bottom: 28px;
      text-align: center;
    }

    .verdict-eye {
      margin: 0 auto 16px;
      width: 48px;
      height: 48px;
    }

    .verdict-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--crimson);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .verdict-text {
      font-family: 'IM Fell English', serif;
      font-size: 15px;
      color: var(--pale-gold);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .verdict-confidence {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: .2em;
      color: #dedad8;
      text-transform: uppercase;
    }

    .accuracy-panel {
      background: rgba(13, 10, 16, .8);
      border: 1px solid rgba(201,168,76, .1);
      padding: 24px;
      margin-bottom: 28px;
    }

    .accuracy-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .accuracy-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .acc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-fulfilled { background: #4caf50; box-shadow: 0 0 6px rgba(76, 175, 80, .5); }
    .dot-pending { background: var(--gold); box-shadow: 0 0 6px rgba(201, 168, 76, .4); }
    .dot-failed { background: var(--blood); box-shadow: 0 0 6px rgba(192, 57, 43, .4); }

    .acc-text {
      font-family: 'IM Fell English', serif;
      font-size: 15px;
      color: var(--silver);
      flex: 1;
      line-height: 1.5;
    }

    .acc-badge {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .badge-fulfilled { background: rgba(76, 175, 80, .2); color: #80ff84; }
    .badge-pending { background: rgba(201, 168, 76, .15); color: var(--gold); }
    .badge-failed { background: rgba(192, 57, 43, .2); color: #ff8080; }

    .category-panel {
      background: rgba(13, 10, 16, .8);
      border: 1px solid rgba(201,168,76, .1);
      padding: 24px;
    }

    .category-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .category-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-tag {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: .1em;
      padding: 5px 12px;
      border: 1px solid rgba(201,168,76, .2);
      color: var(--silver);
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
    }

    .cat-tag:hover, .cat-tag.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76, .05);
    }

    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid rgba(201,168,76, .1);
      padding: 40px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-brand {
      font-family: 'Cinzel Decorative', serif;
      font-size: 12px;
      letter-spacing: .2em;
      color: var(--gold);
      opacity: .9;
    }

    .footer-tagline {
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      color: var(--silver);
      opacity: .8;
    }

    .footer-links {
      display: flex;
      gap: 28px;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: .2em;
      color: var(--silver);
      text-decoration: none;
      text-transform: uppercase;
      opacity: .4;
      transition: opacity .2s;
    }

    .footer-links a:hover {
      opacity: .8;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 6, 8, .92);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--void);
      border: 1px solid rgba(201,168,76, .25);
      padding: 40px;
      max-width: 600px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      transform: translateY(20px);
      transition: transform .3s;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--silver);
      font-size: 20px;
      cursor: pointer;
      opacity: .5;
      transition: opacity .2s;
      font-family: 'Cinzel', serif;
    }

    .modal-close:hover {
      opacity: 1;
    }

    .modal h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 20px;
      color: var(--pale-gold);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .modal-category-display {
      margin-bottom: 16px;
    }

    .modal-excerpt {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 20px;
      color: var(--silver);
      line-height: 1.85;
      margin-bottom: 28px;
    }

    .modal-analysis-title {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .3em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .modal-analysis {
      font-family: 'IM Fell English', serif;
      font-size: 16px;
      color: var(--mist);
      line-height: 1.85;
      margin-bottom: 28px;
      border-left: 2px solid rgba(201,168,76, .2);
      padding-left: 20px;
    }

    .modal-vote-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vote-btn-row {
      display: flex;
      gap: 12px;
    }

    .vote-btn {
      flex: 1;
      background: transparent;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 14px;
      cursor: pointer;
      transition: all .3s;
    }

    .vote-fulfill { border: 1px solid rgba(76, 175, 80, .4); color: #80ff84; }
    .vote-fulfill:hover { background: rgba(76, 175, 80, .15); }
    .vote-doubt { border: 1px solid rgba(192, 57, 43, .4); color: #ff8080; }
    .vote-doubt:hover { background: rgba(192, 57, 43, .15); }

    .market-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-decoration: none;
      border: 1px solid;
      padding: 4px 9px;
      border-radius: 2px;
      transition: all .2s;
      white-space: nowrap;
    }

    .market-link-poly { color: #00d4ff; border-color: rgba(0, 212, 255, .35); }
    .market-link-poly:hover { background: rgba(0, 212, 255, .1); }
    .market-link-fd { color: #1da1f2; border-color: rgba(29, 161, 242, .35); }
    .market-link-fd:hover { background: rgba(29, 161, 242, .1); }
    .market-link-dk { color: #f9c23c; border-color: rgba(249, 194, 60, .35); }
    .market-link-dk:hover { background: rgba(249, 194, 60, .1); }

    .card-footer-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .divergence-flag {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #ff8080;
      letter-spacing: .05em;
      margin-left: 4px;
    }

    .float-eye {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 160px;
      height: 100px;
      z-index: 200;
      opacity: 0;
      transition: opacity .5s;
      pointer-events: none;
      cursor: pointer;
    }

    .float-eye.visible {
      opacity: .7;
      pointer-events: all;
    }

    .float-eye:hover {
      opacity: 1;
    }

    .float-eye svg {
      width: 100%;
      height: 100%;
    }

    @keyframes floatEyeShift {
      0%, 100% { transform: translateX(0px); }
      25% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
    }

    .float-eyeball {
      animation: floatEyeShift 6s ease-in-out infinite;
      transform-origin: 24px 24px;
    }

    @media(max-width: 768px) {
      nav { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
      .nav-links { display: none; }
      .nav-sigil { font-size: 9px; }
      .nav-submit { font-size: 9px; padding: 7px 12px; letter-spacing: .1em; }
      .hero { padding: 40px 16px 28px; }
      .hero h1 { font-size: clamp(28px, 8vw, 48px); }
      .oracle-eye { width: 320px; height: 200px; margin: 0 auto 16px; }
      .oracle-stats { gap: 12px; flex-wrap: wrap; justify-content: center; padding: 16px; }
      .stat-item { min-width: 80px; }
      .stat-divider { display: none; }
      .stat-num { font-size: 22px; }
      .stat-label { font-size: 9px; }
      .ticker-wrap { display: none; }
      .main-grid { grid-template-columns: 1fr; padding: 16px; gap: 28px; }
      .prophecy-card { padding: 18px; }
      .card-title, .card-excerpt { font-size: 17px; }
      .card-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
      .card-footer-links { margin-top: 4px; gap: 6px; }
      .market-link { font-size: 9px; padding: 4px 8px; }
      .modal { padding: 24px 16px; width: 95%; max-height: 90vh; }
      .modal-close { top: 12px; right: 12px; }
      .modal h2 { font-size: 17px; }
      .modal-excerpt { font-size: 16px; }
      .modal-analysis { font-size: 15px; }
      .vote-btn-row { flex-direction: column; gap: 8px; }
      .vote-btn { padding: 12px; font-size: 10px; letter-spacing: .1em; }
      .acc-text { font-size: 13px; }
      .acc-badge { font-size: 9px; }
      .accuracy-item { padding: 8px 0; }
      .cat-tag { font-size: 9px; padding: 5px 10px; }
      .oracle-verdict { padding: 18px; }
      .verdict-text { font-size: 15px; }
      .section-header { padding: 0 16px 20px; }
      footer { padding: 24px 16px; flex-direction: column; gap: 12px; text-align: center; }
      .footer-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
      #vote-email-section input { font-size: 12px; padding: 10px; }
    }

    @media(max-width: 480px) {
      .hero h1 { font-size: 26px; }
      .prophecy-card { padding: 14px; }
      .card-title { font-size: 16px; }
      .stat-num { font-size: 20px; }
      .nav-sigil { font-size: 10px; letter-spacing: .15em; }
    }
  </style>
</head>
